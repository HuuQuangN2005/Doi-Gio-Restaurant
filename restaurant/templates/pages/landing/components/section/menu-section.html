<section id="menu" class="section menu d-flex flex-column light-background"
    data-aos="fade-up">
    <div class="container section-title" data-aos="fade-up">
        <h2 class="pacifico-regular">Menu<br></h2>
        <p><span class="ultra-regular description-title">Menu</span> <span
                class=" ultra-regular">Overviews</span></p>
    </div><!-- End Section Title -->
    <div class="container section menu-container" data-aos="flip-up"
        style="height: 500px;">
        {%if page_quatity>1%}
        <ul class="pagination mt-3">
            {%for i in range(1, page_quatity+1)%}
            <li class="page-item"><a class="page-link"
                    href="/?page={{i}}#menu">{{i}}</a></li>
            {%endfor%}
        </ul>
        {%endif%}

        <div class="row">
            {%for p in foods%}
            <div class="col-md-3 col-4" style="padding:0.7rem">
                <div class="card">
                    <img class="card-img-top" src="{{p.image}}"
                        alt="{{p.name}}">
                    <div class="card-body">
                        <h4 class="card-title">{{p.name}}</h4>
                        <p class="card-text">{{p.price}}</p>
                        <p class="card-text">{{p.description}}</p>
                    </div>
                </div>
            </div>
            {%endfor%}
        </div>

    </div>
</section>
