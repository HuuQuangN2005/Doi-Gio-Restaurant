<section
  id="contact"
  class="section contact d-flex flex-column"
  data-aos="fade-up"
>
  <div class="container section-title" data-aos="fade-up">
    <h2 class="pacifico-regular">Contact<br /></h2>
    <p>
      <span class="ultra-regular description-title">Contact Us</span>
      <span class="ultra-regular">Now</span>
    </p>
  </div>
  <!-- End Section Title -->
  <div class="row container w-100">
    <h1 class="mb-5 text-center">
      Chúng tôi rất hân hạnh được đón tiếp bạn tại vị trí được ghim trên bản
      đồ!!!
    </h1>
    <div class="d-flex justify-content-center align-items-center w-100">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3861.6450228776484!2d108.4397888379115!3d11.889755922564637!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x317112fef20988b1%3A0xad5f228b672bf930!2zVHAuIMSQw6AgTOG6oXQsIEzDom0gxJDhu5NuZywgVmnhu4d0IE5hbQ!5e1!3m2!1svi!2s!4v1764536482518!5m2!1svi!2s"
        width="800"
        height="600"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>
    <h1 class="mt-5 mb-5 text-center" id="booking">
      Ngoài ra, bạn có thể để lại thông tin qua form đăng ký bên dưới để chúng
      tôi hỗ trợ bạn nhanh nhất!!!
    </h1>
    <div class="booking-form" >
        <div>
             <h1 class="text-center">Đăng Ký Đặt Bàn</h1>
             <div class="line"></div>
        </div>
     

      <form action="#" method="POST">
        <label>Họ và tên *</label>
        <input type="text" name="name" required />

        <label>Số điện thoại *</label>
        <input type="tel" name="phone" required />

        <label>Email</label>
        <input type="email" name="email" />

        <label>Ngày đặt *</label>
        <input type="date" name="date" required />

        <label>Giờ đặt *</label>
        <input type="time" name="time" required />

        <label>Số lượng khách *</label>
        <select name="guests" required>
          <option value="1">1 người</option>
          <option value="2">2 người</option>
          <option value="3">3 người</option>
          <option value="4">4 người</option>
          <option value="5">5 người</option>
          <option value="more">Trên 5 người</option>
        </select>

        <label>Ghi chú</label>
        <textarea
          name="note"
          rows="3"
          placeholder="Ví dụ: cần bàn gần cửa sổ, có trẻ nhỏ..."
        ></textarea>
        <div class="d-flex justify-content-center align-items-center">
            <button type="submit">Đặt bàn</button>
        </div>
      </form>
    </div>
  </div>
</section>
